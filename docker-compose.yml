version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liq-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-liq-secret-2024-potosi}
    volumes:
      - liq_data:/app/data
    networks:
      - liq-net

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: liq-web
    restart: unless-stopped
    ports:
      - "3005:80"
    depends_on:
      - app
    networks:
      - liq-net

volumes:
  liq_data:
    driver: local

networks:
  liq-net:
    driver: bridge
